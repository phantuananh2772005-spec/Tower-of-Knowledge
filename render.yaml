services:
  - type: web
    name: tower-of-knowledge
    env: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install && node database/migrate.js --seed
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tower-of-knowledge-db
          property: connectionString

databases:
  - name: tower-of-knowledge-db
    plan: free
    region: singapore
    databaseName: tower_of_knowledge
    user: tower_admin
